# ============================================================
# Cấu hình benchmark. Chỉ cần sửa file này khi thêm domain mới.
# Các ngưỡng (slo) là GIÁ TRỊ KHỞI ĐẦU – hãy chốt lại với mentor.
# ============================================================

server:
  base_url: http://127.0.0.1:8000
  request_timeout_s: 90          # quá thời gian này (im lặng hoặc tổng) = lỗi timeout
  watch_ports: [8000, 8080]      # 8000 = FastAPI, 8080 = llama-server (đo RAM)

# Mỗi domain = 1 dòng. Thêm domain mới (ẩm thực, mua sắm...) chỉ cần thêm
# golden set theo cùng format + 1 mục ở đây.
datasets:
  - domain: administrative_procedures
    golden: domains/administrative_procedures/golden_set.json
    scenarios: task/scenarios_admin.json
  - domain: tourism_demo
    golden: domains/tourism_demo/golden_set.json

behavior:
  multi_turn_gap_s: 2.0          # chờ update_memory (chạy nền) xong giữa các lượt
  reject_markers:                # dấu hiệu câu trả lời là từ chối / không đủ dữ liệu
    - "chưa có trong cơ sở dữ liệu"
    - "không hỗ trợ"
    - "chưa đủ để trả lời"
    - "chưa đủ thông tin"
    - "không thể được xử lý"
    - "vi phạm quy tắc"
    - "Tôi chưa có đủ thông tin"
    - "Xin lỗi, tôi chưa có thông tin"
  friendly_markers: ["nhé", "nha", "nè", "nhỉ", "bạn", "mình", "!", "😊"]

suites:
  quality:  {max_cases: 60}
  latency:  {warmup: 2, sample_per_dataset: 15, repeat_queries: 4, repeat_gap_s: 2.0}
  load:
    levels: [1, 2, 3, 4, 8, 16]
    requests_per_worker: 3
    min_requests_per_level: 4
    target_concurrency: 8
    abort_error_rate: 0.5        # lỗi ≥ 50% thì dừng thang tải
    cooldown_s: 5
    request_timeout_s: 60
  soak:
    concurrency: 4
    duration_s: 600
    session_reuse_ratio: 0.2

# --quick sẽ thu nhỏ các giá trị trên
quick:
  quality:  {max_cases: 12}
  latency:  {warmup: 1, sample_per_dataset: 5, repeat_queries: 2}
  load:     {levels: [1, 2, 4], requests_per_worker: 2}
  soak:     {duration_s: 60}

# ---------------- Ngưỡng đạt (SLO) ----------------
slo:
  quality:
    doc_hit_min: 0.80            # đúng tài liệu (mục tiêu Retrieval ≥ 80% đã đặt ở Layer 1)
    keyword_recall_min: 0.70
    behavior_pass_min: 0.90
    error_rate_max: 0.01
  rules:
    strict_pass_min: 1.0         # domain nghiêm ngặt: không được sai quy tắc nào
    friendly_pass_min: 0.8
    robustness_pass_min: 1.0
  latency:
    ttft_p95_max_s: 5
    total_p50_max_s: 8
    total_p95_max_s: 20
    repeat_hit_p95_max_s: 1.0
  load:
    error_rate_max: 0.01
    total_p95_max_s: 30          # p95 tổng thời gian ở mức tải mục tiêu
  soak:
    error_rate_max: 0.01
    latency_drift_max: 1.5
    api_rss_slope_max_mb_min: 5
    llm_rss_slope_max_mb_min: 5
  resource:
    total_rss_peak_max_mb: 12288   # chỉnh theo máy deploy thật
    api_rss_peak_max_mb: 6144
