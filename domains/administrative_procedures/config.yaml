domain_id: administrative_procedures
domain_name: Thủ tục hành chính

description: >
  Tra cứu các thủ tục hành chính công tại TP.HCM.

# =========================
# Embedding
# =========================
embedding_model: BAAI/bge-m3
embedding_dim: 1024

# =========================
# Vector Store
# =========================
collection_name: administrative_procedures
distance_metric: cosine

# =========================
# Chunking
# =========================
chunk_fields:
  - required_documents
  - fee
  - processing_time
  - submission_method
  - general

chunk_field_specs:
  required_documents:
    suffix: _docs
    label: Thành phần hồ sơ
    attr: required_documents

  fee:
    suffix: _fee
    label: Lệ phí
    attr: fee

  processing_time:
    suffix: _time
    label: Thời gian giải quyết
    attr: processing_time

  submission_method:
    suffix: _method
    label: Hình thức và nơi nộp hồ sơ
    attr: submission_method
    merge_with:
      - submission_location

  general:
    suffix: _general
    label: Nội dung tổng quát
    attr: content

# =========================
# ETL Sources
# =========================
sources:
  - type: json
    path: data/procedures.json

# =========================
# Policy
# =========================
mode: strict
persona: thân thiện, giản dị
risk_level: high

assistant_role: "cán bộ tư vấn thủ tục hành chính"
no_evidence_message: "Tôi chưa có đủ thông tin để trả lời câu hỏi này."
disclaimer: "Đây là thông tin tư vấn tự động. Vui lòng liên hệ cơ quan nhà nước để được hỗ trợ chính xác nhất."
supported_locations:
  - "hồ chí minh"
  - "hcm"
  - "tp hcm"
  - "tp.hcm"
  - "thành phố hồ chí minh"
  - "sài gòn"
  - "saigon"
  - "sg"
min_retrieval_score: 0.50
allowed_tools: []
entity_keywords:
  - "kết hôn"
  - "khai sinh"
  - "khai tử"
  - "nhận cha"
  - "nhận mẹ"
  - "nhận con"
  - "hôn nhân"
  - "tình trạng hôn nhân"
  - "xác nhận tình trạng"
  - "nội quy lao động"
  - "việc làm"
  - "vay vốn"
  - "khuyết tật"
  - "hưu trí"
  - "trợ cấp"
  - "liệt sĩ"
  - "bằng tổ quốc"
  - "thân nhân"
