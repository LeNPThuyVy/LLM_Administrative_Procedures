domain_id: administrative_procedures
domain_name: Thủ tục hành chính

description: >
  Tra cứu các thủ tục hành chính công tại TP.HCM.

# =========================
# Embedding
# =========================
embedding_model: BAAI/bge-m3
embedding_dim: 1024

# =========================
# Vector Store
# =========================
collection_name: administrative_procedures
distance_metric: cosine

# =========================
# Chunking
# =========================
chunk_fields:
  - required_documents
  - fee
  - processing_time
  - submission_method
  - general

chunk_field_specs:
  required_documents:
    suffix: _docs
    label: Thành phần hồ sơ
    attr: required_documents

  fee:
    suffix: _fee
    label: Lệ phí
    attr: fee

  processing_time:
    suffix: _time
    label: Thời gian giải quyết
    attr: processing_time

  submission_method:
    suffix: _method
    label: Hình thức và nơi nộp hồ sơ
    attr: submission_method
    merge_with:
      - submission_location

  general:
    suffix: _general
    label: Nội dung tổng quát
    attr: content

# =========================
# ETL Sources
# =========================
sources:
  - type: json
    path: data/procedures.json

# =========================
# Policy
# =========================
mode: strict
persona: thân thiện, giản dị
risk_level: high

assistant_role: "cán bộ tư vấn thủ tục hành chính"
no_evidence_message: "Tôi chưa có đủ thông tin để trả lời câu hỏi này."
disclaimer: "Đây là thông tin tư vấn tự động. Vui lòng liên hệ cơ quan nhà nước để được hỗ trợ chính xác nhất."
out_of_scope_message: "Hiện tại hệ thống chỉ hỗ trợ tra cứu các thủ tục hành chính công áp dụng tại Thành phố Hồ Chí Minh."
field_intents:
  - key: docs
    label: "GIẤY TỜ / HỒ SƠ cần thiết"
    section_name: "'Thành phần hồ sơ'"
    pattern: "\\b((?<!trên\\s)(?<!trong\\s)giấy\\s+tờ|thành\\s+phần\\s+hồ\\s+sơ|hồ\\s+sơ\\s+gì|hồ\\s+sơ\\s+gồm|hồ\\s+sơ\\s+cần|cần\\s+hồ\\s+sơ|chuẩn\\s+bị\\s+hồ\\s+sơ|những\\s+hồ\\s+sơ|cần\\s+chuẩn\\s+bị|tài\\s+liệu|giấy\\s+chứng\\s+minh|giấy\\s+chứng\\s+sinh|giấy\\s+khai|cần\\s+gì|cần\\s+những\\s+gì|gồm\\s+những\\s+gì|gồm\\s+gì|bao\\s+gồm\\s+những\\s+gì|cần\\s+mang|mang\\s+theo|xuất\\s+trình|required|(?<!tren\\s)(?<!trong\\s)giay\\s+to|thanh\\s+phan\\s+ho\\s+so|ho\\s+so\\s+gi|ho\\s+so\\s+gom|ho\\s+so\\s+can|can\\s+ho\\s+so|chuan\\s+bi\\s+ho\\s+so|can\\s+chuan\\s+bi|tai\\s+lieu|can\\s+gi|can\\s+nhung\\s+gi|gom\\s+nhung\\s+gi|gom\\s+gi|can\\s+mang|xuat\\s+trinh)\\b"
  - key: method
    label: "HÌNH THỨC NỘP HỒ SƠ"
    section_name: "'Hình thức nộp'"
    pattern: "\\b(hình\\s+thức\\s+nộp|hình\\s+thức\\s+nào|nộp\\s+online|nộp\\s+trực\\s+tuyến|nộp\\s+trực\\s+tiếp|cách\\s+nộp|nộp\\s+ở\\s+đâu|nộp\\s+tại\\s+đâu|nộp\\s+hồ\\s+sơ\\s+ở\\s+đâu|nộp\\s+hồ\\s+sơ\\s+tại\\s+đâu|làm\\s+ở\\s+đâu|đăng\\s+ký\\s+ở\\s+đâu|ở\\s+đâu|tại\\s+đâu|nơi\\s+nộp|địa\\s+điểm\\s+nộp|submission\\s+method|hinh\\s+thuc\\s+nop|hinh\\s+thuc\\s+nao|nop\\s+online|nop\\s+truc\\s+tuyen|nop\\s+truc\\s+tiep|cach\\s+nop|nop\\s+o\\s+dau|nop\\s+tai\\s+dau|nop\\s+ho\\s+so\\s+o\\s+dau|lam\\s+o\\s+dau|o\\s+dau|tai\\s+dau|noi\\s+nop)\\b"
  - key: fee
    label: "LỆ PHÍ"
    section_name: "'Lệ phí'"
    pattern: "\\b(lệ\\s+phí|lệ\\s+pí|chi\\s+phí\\s+làm|miễn\\s+phí|bao\\s+nhiêu\\s+tiền|mất\\s+bao\\s+nhiêu\\s+tiền|mất\\s+phí|tốn\\s+phí|thu\\s+phí|phí\\s+chứng\\s+thực|phí\\s+đăng\\s+ký|phí\\s+cấp|mức\\s+thu|bao\\s+nhiêu\\s+một\\s+trường\\s+hợp|lệ\\s+phí.*?(?:bao\\s+nhiêu|bn)|phí.*?(?:bao\\s+nhiêu\\s+tiền|là\\s+bao\\s+nhiêu)|cấp\\s+lại.*bao\\s+nhiêu|fee|le\\s+phi|le\\s+pi|mien\\s+phi|bao\\s+nhieu\\s+tien|mat\\s+phi|ton\\s+phi|thu\\s+phi|phi\\s+chung\\s+thuc|muc\\s+thu|le\\s+phi.*?(?:bao\\s+nhieu|bn)|phi.*?(?:bao\\s+nhieu\\s+tien|la\\s+bao\\s+nhieu))\\b"
  - key: time
    label: "THỜI GIAN GIẢI QUYẾT"
    section_name: "'Thời gian giải quyết'"
    pattern: "\\b(thời\\s+gian|bao\\s+lâu|mấy\\s+ngày|thời\\s+hạn|bao\\s+nhiêu\\s+ngày|trong\\s+ngày|lấy\\s+ngay|processing\\s+time|thoi\\s+gian|bao\\s+lau|may\\s+ngay|thoi\\s+han|bao\\s+nhieu\\s+ngay|trong\\s+ngay|lay\\s+ngay)\\b"
