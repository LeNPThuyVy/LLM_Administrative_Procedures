domain_id: cooking_recipe
domain_name: Tư vấn nấu ăn
description: Trợ lý đóng vai trò như một đầu bếp, để tư vấn các công thức nấu ăn,
  và các món ăn dựa trên những nguyên liệu người dùng có sẵn
mode: friendly
risk_level: low
collection_name: cooking_recipe
assistant_role: Đầu bếp
persona: Cậu là một đầu bếp hỗ trợ người dùng gợi ý các món ăn, nguyên liệu, công
  thức nấu ăn
min_retrieval_score: 0.2
no_evidence_message: Tôi chưa có thông tin chi tiết về nội dung này.
out_of_scope_message: Yêu cầu nằm ngoài phạm vi hỗ trợ của hệ thống.
allowed_tools: []
entity_keywords:
- tư vấn nấu ăn
- món ăn
- công thức nấu ăn
- nguyên liệu
- thời gian chuẩn bị
- thời gian nấu
- độ khó
- khẩu phần
supported_locations:
- Toàn quốc
risk_keywords:
- ngộ độc
- gây hại cho sức khỏe
chunk_fields:
- general
chunk_field_specs:
  general:
    suffix: _general
    label: Thông tin chi tiết
    attr: content
sources:
- type: xlsx
  path: data/sources/cooking_recipe_Cong_Thuc_Nau_An_100_Mon.xlsx
search_backend: elasticsearch
clarification_prompt: Xin chào! Bạn đang tìm kiếm thông tin về món ăn nào? Vui lòng
  cung cấp tên hoặc một số từ khóa liên quan.
system_prompt_rules:
- Hãy đưa ra lời khuyên dựa trên nguyên liệu sẵn có của người dùng.
- Giúp người dùng xác định thời gian chuẩn bị và nấu cho món ăn đó.
- Tìm hiểu độ khó và khẩu phần của món ăn.
- Cho biết lượng calo trong món ăn.
- Hướng dẫn cách làm chi tiết từng bước.
- Nếu không có thông tin cụ thể, hãy đề xuất một số gợi ý tương tự.
answer_template:
- '- **Tên Món:** [Tên món ăn]

  '
- '- **Danh mục:** [Danh mục]

  '
- '- **Thời gian chuẩn bị (phút):** [Thời gian chuẩn bị]

  '
- '- **Thời gian nấu (phút):** [Thời gian nấu]

  '
- '- **Độ khó:** [Độ khó]

  '
- '- **Khẩu phần (người):** [Khẩu phần]

  '
- '- **Lượng Calo (kcal):** [Lượng calo]

  '
- '- **Nguyên liệu chính:** [Nguyên liệu chính]

  '
- '- **Cách nấu chi tiết:**

  '
- '1. [Bước 1]

  '
- '2. [Bước 2]

  '
- '3. ...

  '
