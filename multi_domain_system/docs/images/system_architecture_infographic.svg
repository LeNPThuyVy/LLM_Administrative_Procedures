<rect width="1600" height="980" fill="url(#bg)"/>
<rect x="30" y="24" width="1540" height="82" rx="18" fill="#164f86"/>
<text x="70" y="62" class="title">KIẾN TRÚC HỆ THỐNG LLM ADMINISTRATIVE PROCEDURES</text>
<text x="70" y="88" class="subtitle">RAG đa miền • Tra cứu thủ tục hành chính • Streaming • Evidence-based Answering</text>

<text x="45" y="145" class="section">1. LUỒNG REQUEST ONLINE / REALTIME</text>
<g filter="url(#shadow)">
<rect x="45" y="170" width="195" height="170" rx="16" fill="#fff1f6" stroke="#ef9fbd"/>
<rect x="265" y="170" width="195" height="170" rx="16" fill="#eef8ff" stroke="#86bfe9"/>
<rect x="485" y="170" width="195" height="170" rx="16" fill="#f5f0ff" stroke="#b9a0e6"/>
<rect x="705" y="170" width="195" height="170" rx="16" fill="#effcf5" stroke="#8fd2ad"/>
<rect x="925" y="170" width="260" height="170" rx="16" fill="#fff7e8" stroke="#e9bd68"/>
<rect x="1210" y="170" width="345" height="170" rx="16" fill="#eef5ff" stroke="#8baee6"/>
</g>
<circle cx="70" cy="195" r="16" fill="#e83873"/><text x="65" y="200" class="badge">1</text><text x="90" y="202" class="boxTitle">Người dùng</text>
<text x="63" y="230" class="text">• Nhập câu hỏi tự nhiên</text><text x="63" y="254" class="text">• Chọn / tạo phiên chat</text><text x="63" y="278" class="text">• Xem evidence [EC_xxx]</text><text x="63" y="302" class="text">• Nhận kết quả streaming</text>
<circle cx="290" cy="195" r="16" fill="#3495d9"/><text x="285" y="200" class="badge">2</text><text x="310" y="202" class="boxTitle">Web UI</text>
<text x="283" y="230" class="text">• HTML / CSS / Vanilla JS</text><text x="283" y="254" class="text">• Fetch API / WebSocket</text><text x="283" y="278" class="text">• Dark / Light mode</text><text x="283" y="302" class="text">• Session &amp; evidence chips</text>
<circle cx="510" cy="195" r="16" fill="#8362d8"/><text x="505" y="200" class="badge">3</text><text x="530" y="202" class="boxTitle">FastAPI Gateway</text>
<text x="503" y="230" class="text">• Uvicorn ASGI</text><text x="503" y="254" class="text">• /api/chat (SSE)</text><text x="503" y="278" class="text">• /ws/chat (WebSocket)</text><text x="503" y="302" class="text">• Session / Domain APIs</text>
<circle cx="730" cy="195" r="16" fill="#35a46c"/><text x="725" y="200" class="badge">4</text><text x="750" y="202" class="boxTitle">Queue &amp; Context</text>
<text x="723" y="230" class="text">• Session Lock</text><text x="723" y="254" class="text">• Global Semaphore</text><text x="723" y="278" class="text">• LLAMA_PARALLEL = 1</text><text x="723" y="302" class="text">• Active Procedure</text>
<circle cx="950" cy="195" r="16" fill="#df9a25"/><text x="945" y="200" class="badge">5</text><text x="970" y="202" class="boxTitle">RAG Core Pipeline</text>
<text x="943" y="230" class="text">Guard → Risk/Scope → Procedure Reader</text><text x="943" y="254" class="text">→ Synthesizer → Retrieval → Rerank</text><text x="943" y="278" class="text">→ Evidence → Verification → Output Guard</text><text x="943" y="302" class="text">Template Fast Path hoặc LLM</text>
<circle cx="1235" cy="195" r="16" fill="#357bd5"/><text x="1230" y="200" class="badge">6</text><text x="1255" y="202" class="boxTitle">Streaming Response</text>
<text x="1228" y="230" class="text">• event: chunk</text><text x="1228" y="254" class="text">• event: evidence</text><text x="1228" y="278" class="text">• event: clarification</text><text x="1228" y="302" class="text">• event: done</text>
<path class="line" d="M240 255 H260"/><path class="line" d="M460 255 H480"/><path class="line" d="M680 255 H700"/><path class="line" d="M900 255 H920"/><path class="line" d="M1185 255 H1205"/>

