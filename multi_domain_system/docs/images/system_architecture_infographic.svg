<text x="585" y="452" class="boxTitle">PostgreSQL / Context Memory</text>
<text x="585" y="485" class="text">• users</text><text x="585" y="515" class="text">• sessions</text><text x="585" y="545" class="text">• messages</text><text x="585" y="575" class="text">• evidence (JSONB)</text><text x="585" y="605" class="text">• lịch sử &amp; active_procedure</text>
<text x="790" y="452" class="boxTitle">Qdrant Vector DB</text>
<text x="790" y="485" class="text">• Local hoặc Cloud</text><text x="790" y="515" class="text">• Collection theo domain</text><text x="790" y="545" class="text">• Cosine vector search</text><text x="790" y="575" class="text">• Metadata filtering</text><text x="790" y="605" class="text">• BGE-M3 embeddings</text>

<text x="1110" y="452" class="boxTitle">Safety &amp; Quality</text>
<text x="1110" y="485" class="text">• Prompt Injection Detection</text><text x="1110" y="515" class="text">• PII masking / redaction</text><text x="1110" y="545" class="text">• Domain validation</text><text x="1110" y="575" class="text">• Location scope gate</text><text x="1110" y="605" class="text">• Evidence verification</text><text x="1110" y="635" class="text">• Citation mapper &amp; disclaimer</text>

